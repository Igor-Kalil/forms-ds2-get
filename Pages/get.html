<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8"/>
        <title>Lista de jogos</title>
        <link rel="stylesheet" href="../css/get.css"/>
        <script src="../js/get.js" defer></script>
    </head>
    <body>
          <header>
        <h1>Lista de jogos</h1>
        <p>Veja a baixo a lista de jogos</p>
        </header>            
        <main>
            <P><a href="../index.html">Voltar para o cadastro</a></P>
            <section id="container-titulo-lista">
                <h2 id="titulo-lista">jogos cadastrados</h2>
                <p>Os jogos são exibidos automaticamente após abrir a página</p>
                <P id="resposta"></P>
                <ul id="lista-jogos"></ul>
            </section>
        </main>

         <template id="modelo-jogo">
      <li>
        <section class="card-capa">
          <img class="imagem-jogo" alt="" />
        </section>
                <Section class="card-conteudo">
                <h3 class="nome"></h3>
                <p><strong>Gênero:</strong><span class="genero"></span></p>
                <p><strong>Plataforma:</strong><span class="plataforma"></span></p>
                <p><strong>Ano_lancamento:</strong><span class="ano_lancamento"></span></p>
                <p><strong>Desenvolvedora:</strong><span class="desenvolvedora"></span></p>

                </Section>
            </li>
        </template>
    </body>
</html>
